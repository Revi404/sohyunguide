<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소현생정 | 소비를 현명하게</title>
<meta name="description" content="소현생정 — 소비를 현명하게, 가성비 꿀템 리뷰. 블로그 새 글과 추천템을 한곳에서.">
<meta property="og:title" content="소현생정 | 소비를 현명하게">
<meta property="og:description" content="가성비 꿀템 리뷰 · 생활정보 · 추천템 모음">
<meta property="og:image" content="assets/profile.jpg">
<meta name="theme-color" content="#f4f2e9">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a id="notice" class="notice" hidden></a>

<main class="wrap">
  <header class="hero">
    <span class="blob blob-a" aria-hidden="true"></span>
    <span class="blob blob-b" aria-hidden="true"></span>
    <div class="avatar"><img id="avatar" alt="소현생정 프로필" width="104" height="104"></div>
    <p class="eyebrow">SMART CONSUMER LIFE</p>
    <h1 class="name">
      <svg class="sprout" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V15" stroke="#0c5230" stroke-width="2.6" stroke-linecap="round"/><path d="M16 16C16 9 11 5 4 5c0 7 5 11 12 11Z" fill="#1e9150"/><path d="M16 13c0-5 4-9 11-9 0 6-4 9-11 9Z" fill="#0c5230"/></svg>
      <span id="name">소현생정</span>
    </h1>
    <p class="tagline" id="tagline"><mark class="mk">소비를 현명하게</mark>, 가성비 꿀템 리뷰</p>
    <p class="bio" id="bio"></p>
  </header>

  <nav class="links" id="links" aria-label="바로가기"></nav>

  <div class="tabs" role="tablist" aria-label="콘텐츠">
    <button role="tab" id="tab-items" aria-controls="panel-items" aria-selected="true">추천템</button>
    <button role="tab" id="tab-blog" aria-controls="panel-blog" aria-selected="false">블로그 새 글</button>
  </div>

  <section id="panel-items" role="tabpanel" aria-labelledby="tab-items">
    <div class="chips" id="item-filters"></div>
    <div class="grid" id="items"></div>
  </section>

  <section id="panel-blog" role="tabpanel" aria-labelledby="tab-blog" hidden>
    <div class="chips" id="blog-filters"></div>
    <ol class="posts" id="posts"></ol>
    <a class="more" id="blog-more" target="_blank" rel="noopener">블로그에서 전체 글 보기 →</a>
  </section>

  <footer class="foot">
    <p class="disclosure" id="disclosure"></p>
    <p class="meta"><span id="updated"></span> · © 소현생정</p>
  </footer>
</main>

<script src="app.js" defer></script>
</body>
</html>
